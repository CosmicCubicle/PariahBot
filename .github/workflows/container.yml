name: Container image

# Builds the Dockerfile on every PR, and publishes it to
# ghcr.io/cosmiccubicle/pariahbot from main and from release tags (v1.1.0 and
# so on, pushed by `gh release create`). The two are separate jobs so the one
# that runs a PR's code never holds a token that can write packages (see the
# note in tests.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both architectures, as publishing builds them, so an arm64 problem
      # shows up here rather than first on main. npm ci isn't emulated (see
      # the Dockerfile), so the arm64 build is quick. Nothing is pushed.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    name: Publish image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 too, for Raspberry Pis and AWS Graviton; better-sqlite3 ships
      # prebuilt binaries for both.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest follows main, like the systemd sync job; a release tag v1.2.3
      # publishes 1.2.3 and 1.2, for hosts that would rather move only on
      # releases; sha-<commit> tags let a host pin any build or roll back.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cosmiccubicle/pariahbot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
