name: Container image

# Builds the Dockerfile on every PR, and publishes it to
# ghcr.io/cosmiccubicle/pariahbot from main. The two are separate jobs so the
# one that runs a PR's code never holds a token that can write packages (see
# the note in tests.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # amd64 only: proves the Dockerfile still builds without the slow
      # emulated arm64 build. Nothing is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  publish:
    name: Publish image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 too, for Raspberry Pis and AWS Graviton; better-sqlite3 ships
      # prebuilt binaries for both.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest follows main; sha-<commit> tags let a host pin or roll back.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cosmiccubicle/pariahbot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
